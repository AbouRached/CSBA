<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>TeleVault</title>
<link rel="stylesheet" href="/static/styles.css">
<meta name="theme-color" content="#182957">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23182957'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='7.5' fill='none' stroke='%23F6E200' stroke-width='3' transform='rotate(-8 16 16)'/%3E%3Crect x='7' y='15' width='18' height='2.4' rx='1' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="/static/brand/logo-small.png" width="96" height="60" alt="Logo">
      <div><div class="brand-name">Tele<b>Vault</b></div><div class="brand-sub">Call Recording Archive</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="who">
      <span id="who-name"></span>
      <span id="who-scope" class="muted"></span>
      <button class="btn ghost" id="btn-logout" type="button">Sign out</button>
    </div>
  </header>
  <main id="main" class="main"></main>
  <footer class="foot">TeleVault · read-only archive · every play and download is logged</footer>
</div>

<div id="login" class="login" hidden>
  <form id="login-form" class="card login-card" autocomplete="on">
    <div class="login-brand">
      <img src="/static/brand/logo.png" width="300" height="188" alt="Logo">
      <div class="brand-name">Tele<b>Vault</b></div>
      <div class="brand-sub">Call Recording Archive</div>
    </div>
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p id="login-error" class="error" role="alert"></p>
    <p class="muted small staff-link">Staff away from the office: <a href="/api/auth/staff-login">verify your staff email</a> first, then sign in.</p>
  </form>
</div>

<div id="toast" class="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
